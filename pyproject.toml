[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-finetuning-and-serving"
version = "0.1.0"
description = "Local language model adaptation, evaluation, and serving for banking support tickets"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["typer>=0.12,<1", "pydantic>=2.7,<3", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
data = ["datasets>=5.0.1,<6", "huggingface-hub>=0.23"]
mlx = ["mlx-lm[train]>=0.21"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
llm-finetuning-and-serving = "llm_finetuning_and_serving.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_finetuning_and_serving"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
